% SU2 configuration template for 2D airfoil polar study
% Replace mesh filename, Mach/Reynolds settings and solver controls as needed.

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT

MACH_NUMBER= 0.15
AOA= {{AOA}}
SIDESLIP_ANGLE= 0.0
REYNOLDS_NUMBER= 6000000
REYNOLDS_LENGTH= 1.0

FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15

MARKER_EULER= ( farfield )
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

MESH_FILENAME= mesh_NACA0012.su2
MESH_FORMAT= SU2

CFL_NUMBER= 5.0
EXT_ITER= 1000
CONV_RESIDUAL_MINVAL= -8
CONV_STARTITER= 10

VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
RESTART_FILENAME= restart_flow
CONV_FILENAME= history
OUTPUT_FILES= RESTART, PARAVIEW, SURFACE_PARAVIEW
SCREEN_OUTPUT= INNER_ITER, RMS_RES, LIFT, DRAG, MOMENT_Z
HISTORY_OUTPUT= ITER, RMS_RES, LIFT, DRAG, MOMENT_Z
